<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="vouch-title">
  <title id="vouch-title">vouch — local authentication multiplexer &amp; AI gateway</title>
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171d26" />
      <stop offset="100%" stop-color="#0b0e13" />
    </linearGradient>
    <linearGradient id="border-grad" x1="24" y1="24" x2="488" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3a4658" />
      <stop offset="100%" stop-color="#202731" />
    </linearGradient>
    <linearGradient id="arm-left" x1="132" y1="176" x2="242" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#b4c2d4" />
    </linearGradient>
    <linearGradient id="arm-feed" x1="222" y1="144" x2="297" y2="271" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="arm-check" x1="242" y1="362" x2="378" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#6ae37c" />
    </linearGradient>
  </defs>

  <!-- Rounded squircle container visible cleanly on both light and dark themes -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="4" />
  <rect x="30" y="30" width="452" height="452" rx="102" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="2" />

  <!-- Two parallel multiplexed input channels converging onto the verified emerald trunk -->
  <path d="M 132 176 L 242 362" fill="none" stroke="url(#arm-left)" stroke-width="46" stroke-linecap="round" />
  <path d="M 222 144 L 297 271" fill="none" stroke="url(#arm-feed)" stroke-width="32" stroke-linecap="round" />

  <!-- Subtle dark seam behind the verified emerald exit arm for depth -->
  <path d="M 242 362 L 378 148" fill="none" stroke="#0e1116" stroke-width="60" stroke-linecap="round" />

  <!-- Verified egress V / checkmark stroke -->
  <path d="M 242 362 L 378 148" fill="none" stroke="url(#arm-check)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
</svg>
