<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160" role="img" aria-labelledby="wordmark-title">
  <title id="wordmark-title">vouch — Local Authentication Multiplexer &amp; AI Gateway</title>
  <defs>
    <linearGradient id="card-bg" x1="0" y1="0" x2="680" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141922" />
      <stop offset="100%" stop-color="#0b0e13" />
    </linearGradient>
    <linearGradient id="icon-bg" x1="16" y1="16" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b222d" />
      <stop offset="100%" stop-color="#0e1116" />
    </linearGradient>
    <linearGradient id="wm-left" x1="45" y1="53" x2="77" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#b4c2d4" />
    </linearGradient>
    <linearGradient id="wm-feed" x1="71" y1="44" x2="93" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#79c0ff" />
      <stop offset="100%" stop-color="#388bfd" />
    </linearGradient>
    <linearGradient id="wm-check" x1="77" y1="108" x2="117" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#6ae37c" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="676" height="156" rx="28" fill="url(#card-bg)" stroke="#2c3543" stroke-width="2" />

  <!-- Icon badge -->
  <rect x="18" y="18" width="124" height="124" rx="28" fill="url(#icon-bg)" stroke="#333e4f" stroke-width="2" />
  <path d="M 45 53 L 77 108" fill="none" stroke="url(#wm-left)" stroke-width="13" stroke-linecap="round" />
  <path d="M 71 44 L 93 81" fill="none" stroke="url(#wm-feed)" stroke-width="9.5" stroke-linecap="round" />
  <path d="M 77 108 L 117 45" fill="none" stroke="#0e1116" stroke-width="17" stroke-linecap="round" />
  <path d="M 77 108 L 117 45" fill="none" stroke="url(#wm-check)" stroke-width="13.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Wordmark + Version pill + Tagline -->
  <text x="170" y="82" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace" font-size="56" font-weight="700" letter-spacing="-1.5" fill="#f0f6fc">vouch</text>
  <rect x="362" y="45" width="84" height="32" rx="16" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950" stroke-opacity="0.45" stroke-width="1.5" />
  <text x="404" y="66" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="16" font-weight="600" fill="#56d364">v5.0.0</text>
  <text x="172" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#8b949e">Local auth multiplexer &amp; supervised AI gateway</text>
