name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package and publish (e.g. v6.0.0); defaults to Cargo.toml version"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            strip: strip
            ext: ""
            archive: tgz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            strip: aarch64-linux-gnu-strip
            ext: ""
            archive: tgz
          - target: x86_64-apple-darwin
            os: macos-latest
            strip: strip
            ext: ""
            archive: tgz
          - target: aarch64-apple-darwin
            os: macos-latest
            strip: strip
            ext: ""
            archive: tgz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            strip: ""
            ext: ".exe"
            archive: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Install NASM for Windows AWS-LC build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive (Unix)
        if: matrix.archive == 'tgz'
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          mkdir -p dist staging
          ${{ matrix.strip }} "target/${{ matrix.target }}/release/vouch"
          cp "target/${{ matrix.target }}/release/vouch" staging/
          cp LICENSE NOTICE README.md CHANGELOG.md vouch.example.toml staging/
          tar -czf "dist/vouch-${TAG}-${{ matrix.target }}.tar.gz" -C staging .

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ needs.prepare.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vouch.exe" staging/
          Copy-Item LICENSE, NOTICE, README.md, CHANGELOG.md, vouch.example.toml staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/vouch-${tag}-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vouch-${{ matrix.target }}
          path: dist/*

  linux_packages:
    name: Package Linux Distros (.deb / .rpm / .pkg.tar.zst)
    needs: [prepare, build]
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: tarballs
          merge-multiple: true

      - name: Install nfpm and package verification tools
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm rpm zstd

      - name: Build .deb, .rpm, and Arch .pkg.tar.zst packages
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          mkdir -p dist

          build_distro_pkgs() {
            local rust_target="$1"
            local nfpm_arch="$2"
            mkdir -p "unpack-${nfpm_arch}"
            tar -xzf "tarballs/vouch-${TAG}-${rust_target}.tar.gz" -C "unpack-${nfpm_arch}"
            export VERSION="${VERSION}"
            export ARCH="${nfpm_arch}"
            export BIN_PATH="unpack-${nfpm_arch}/vouch"
            nfpm package --config packaging/nfpm.yaml --packager deb --target dist/
            nfpm package --config packaging/nfpm.yaml --packager rpm --target dist/
            nfpm package --config packaging/nfpm.yaml --packager archlinux --target dist/
          }

          build_distro_pkgs "x86_64-unknown-linux-gnu" "amd64"
          build_distro_pkgs "aarch64-unknown-linux-gnu" "arm64"

          echo "=== Verifying generated Linux distro packages ==="
          ls -lh dist/
          for pkg in dist/*.deb; do dpkg-deb --info "$pkg" && dpkg-deb --contents "$pkg"; done
          for pkg in dist/*.rpm; do rpm -qip "$pkg" && rpm -qlp "$pkg"; done
          for pkg in dist/*.pkg.tar.zst; do tar --zstd -tf "$pkg"; done

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: vouch-linux-packages
          path: dist/*

  publish:
    name: Publish GitHub Release
    needs: [prepare, build, linux_packages]
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build and package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS, Release Notes, Homebrew Formula, and Arch PKGBUILD
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${TAG#v}"
          cd dist
          sha256sum vouch-*.tar.gz vouch-*.zip *.deb *.rpm *.pkg.tar.zst > SHA256SUMS.txt
          cp ../packaging/homebrew/vouch.rb vouch.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" vouch.rb
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            SUM="$(grep "vouch-${TAG}-${target}.tar.gz" SHA256SUMS.txt | awk '{print $1}')"
            PLACEHOLDER="REPLACE_WITH_$(echo "${target}" | tr '[:lower:]-' '[:upper:]_')_SHA256"
            if [ -n "${SUM}" ]; then
              sed -i "s/${PLACEHOLDER}/${SUM}/g" vouch.rb
            fi
          done
          cp ../packaging/arch/PKGBUILD PKGBUILD
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          cd ..
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
