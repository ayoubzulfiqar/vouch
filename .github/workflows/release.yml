name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            strip: strip
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            strip: aarch64-linux-gnu-strip
          - target: x86_64-apple-darwin
            os: macos-latest
            strip: strip
          - target: aarch64-apple-darwin
            os: macos-latest
            strip: strip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross linker for aarch64-unknown-linux-gnu
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        shell: bash
        run: |
          mkdir -p dist staging
          ${{ matrix.strip }} "target/${{ matrix.target }}/release/vouch"
          cp "target/${{ matrix.target }}/release/vouch" staging/
          cp LICENSE NOTICE README.md CHANGELOG.md vouch.example.toml staging/
          tar -czf "dist/vouch-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz" -C staging .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vouch-${{ matrix.target }}
          path: dist/*.tar.gz

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS and update Homebrew formula
        shell: bash
        run: |
          cd dist
          sha256sum vouch-*.tar.gz > SHA256SUMS.txt
          TAG="${GITHUB_REF_NAME#v}"
          cp ../packaging/homebrew/vouch.rb vouch.rb
          sed -i "s/version \".*\"/version \"${TAG}\"/" vouch.rb
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            SUM="$(grep "vouch-${GITHUB_REF_NAME}-${target}.tar.gz" SHA256SUMS.txt | awk '{print $1}')"
            PLACEHOLDER="REPLACE_WITH_$(echo "${target}" | tr '[:lower:]-' '[:upper:]_')_SHA256"
            if [ -n "${SUM}" ]; then
              sed -i "s/${PLACEHOLDER}/${SUM}/g" vouch.rb
            fi
          done
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
