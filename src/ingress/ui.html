<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vouch — gateway monitor</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect x='24' y='24' width='464' height='464' rx='108' fill='%230e1116' stroke='%232e3744' stroke-width='8'/%3E%3Cpath d='M132 176 L242 362' fill='none' stroke='%23e6edf3' stroke-width='46' stroke-linecap='round'/%3E%3Cpath d='M222 144 L297 271' fill='none' stroke='%2358a6ff' stroke-width='32' stroke-linecap='round'/%3E%3Cpath d='M242 362 L378 148' fill='none' stroke='%230e1116' stroke-width='60' stroke-linecap='round'/%3E%3Cpath d='M242 362 L378 148' fill='none' stroke='%233fb950' stroke-width='48' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #0e1116;
      --surface: #161b22;
      --border: #2a313c;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #3fb950;
      --warn: #d29922;
      --err: #f85149;
      --info: #58a6ff;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .wrap { max-width: 1040px; margin: 0 auto; }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 18px; margin: 0; font-family: var(--mono); }
    .brand { display: flex; align-items: center; gap: 10px; }
    .meta { color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px 14px;
    }
    .card-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-val { font-size: 20px; font-weight: 600; font-family: var(--mono); margin-top: 4px; }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 18px;
    }
    .panel-title {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
    }
    table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12px; }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    tr:last-child td { border-bottom: none; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .ok { background: rgba(63, 185, 80, 0.16); color: var(--accent); }
    .warn { background: rgba(210, 153, 34, 0.16); color: var(--warn); }
    .err { background: rgba(248, 81, 73, 0.16); color: var(--err); }
    .info { background: rgba(88, 166, 255, 0.16); color: var(--info); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg viewBox="0 0 512 512" width="28" height="28" aria-hidden="true">
          <rect x="24" y="24" width="464" height="464" rx="108" fill="#141922" stroke="#2e3744" stroke-width="8" />
          <path d="M 132 176 L 242 362" fill="none" stroke="#e6edf3" stroke-width="46" stroke-linecap="round" />
          <path d="M 222 144 L 297 271" fill="none" stroke="#58a6ff" stroke-width="32" stroke-linecap="round" />
          <path d="M 242 362 L 378 148" fill="none" stroke="#141922" stroke-width="60" stroke-linecap="round" />
          <path d="M 242 362 L 378 148" fill="none" stroke="#3fb950" stroke-width="48" stroke-linecap="round" />
        </svg>
        <h1 id="title">vouch gateway</h1>
      </div>
      <div class="meta" id="meta">connecting...</div>
    </header>
    <section class="cards" id="cards"></section>
    <section class="panel">
      <div class="panel-title">Backends &amp; Circuit Breakers</div>
      <table>
        <thead>
          <tr>
            <th>Backend</th>
            <th>Kind</th>
            <th>Permits</th>
            <th>Circuit</th>
            <th>Failures</th>
            <th>Child Exits</th>
          </tr>
        </thead>
        <tbody id="backends-body"></tbody>
      </table>
    </section>
    <section class="panel">
      <div class="panel-title">Request Counters</div>
      <table>
        <thead>
          <tr>
            <th>Protocol</th>
            <th>Endpoint</th>
            <th>Status</th>
            <th>Count</th>
          </tr>
        </thead>
        <tbody id="requests-body"></tbody>
      </table>
    </section>
  </div>
  <script>
    function parseProm(text) {
      const permits = {}, okExits = {}, errExits = {}, reqs = [];
      let fallbacks = 0, rateLimits = 0;
      for (const raw of text.split("\n")) {
        const line = raw.trim();
        if (!line || line.startsWith("#")) continue;
        const idx = line.lastIndexOf(" ");
        if (idx <= 0) continue;
        const val = Number(line.slice(idx + 1));
        if (Number.isNaN(val)) continue;
        const head = line.slice(0, idx);
        const brace = head.indexOf("{");
        const name = brace === -1 ? head : head.slice(0, brace);
        const labels = {};
        if (brace !== -1 && head.endsWith("}")) {
          for (const part of head.slice(brace + 1, -1).split(",")) {
            const eq = part.indexOf("=");
            if (eq > 0) {
              labels[part.slice(0, eq).trim()] = part.slice(eq + 1).trim().replace(/^"|"$/g, "");
            }
          }
        }
        if (name === "vouch_active_permits" && labels.backend) {
          permits[labels.backend] = val;
        } else if (name === "vouch_child_exit_total" && labels.backend) {
          if (labels.code === "0") okExits[labels.backend] = (okExits[labels.backend] || 0) + val;
          else errExits[labels.backend] = (errExits[labels.backend] || 0) + val;
        } else if (name === "vouch_requests_total") {
          reqs.push({ protocol: labels.protocol || "-", endpoint: labels.endpoint || "-", status: labels.status || "-", count: val });
        } else if (name === "vouch_fallbacks_total") {
          fallbacks += val;
        } else if (name === "vouch_token_rate_limited_total") {
          rateLimits += val;
        }
      }
      return { permits, okExits, errExits, reqs, fallbacks, rateLimits };
    }

    function addCell(tr, text, cls) {
      const td = document.createElement("td");
      if (cls) {
        const span = document.createElement("span");
        span.className = "pill " + cls;
        span.textContent = text;
        td.appendChild(span);
      } else {
        td.textContent = text;
      }
      tr.appendChild(td);
    }

    function renderCards(health, ready, m) {
      const root = document.getElementById("cards");
      root.replaceChildren();
      const items = [
        ["Status", ready && ready.ready ? "READY" : "DEGRADED"],
        ["Uptime", health ? health.uptime_secs + "s" : "-"],
        ["Routes", health ? String(health.models) : "-"],
        ["Auth Mode", health && health.tokens_enforced ? "Enforced" : "Local"],
        ["Fallbacks", String(m.fallbacks)],
        ["Rate Limits", String(m.rateLimits)],
      ];
      for (const [label, val] of items) {
        const card = document.createElement("div");
        card.className = "card";
        const l = document.createElement("div");
        l.className = "card-label";
        l.textContent = label;
        const v = document.createElement("div");
        v.className = "card-val";
        v.textContent = val;
        card.appendChild(l);
        card.appendChild(v);
        root.appendChild(card);
      }
    }

    async function refresh() {
      try {
        const [hRes, rRes, mRes] = await Promise.all([
          fetch("/healthz"),
          fetch("/readyz"),
          fetch("/metrics"),
        ]);
        const health = await hRes.json();
        const ready = await rRes.json();
        const m = parseProm(await mRes.text());

        document.getElementById("title").textContent = "vouch v" + health.version;
        document.getElementById("meta").textContent =
          "backends=" + health.backends + " · workspace=" + (health.workspace_enabled ? "on" : "off") + " · updated " + new Date().toLocaleTimeString();

        renderCards(health, ready, m);

        const bBody = document.getElementById("backends-body");
        bBody.replaceChildren();
        for (const b of ready.backends || []) {
          const tr = document.createElement("tr");
          const active = m.permits[b.id] || 0;
          const ok = m.okExits[b.id] || 0;
          const err = m.errExits[b.id] || 0;
          const cls = (b.auth_expired || b.circuit === "open") ? "err" : (b.circuit === "half_open" ? "warn" : "ok");
          const cText = b.auth_expired
            ? "AUTH_EXPIRED (" + b.open_remaining_secs + "s)"
            : (b.circuit === "open" ? "OPEN (" + b.open_remaining_secs + "s)" : b.circuit.toUpperCase());
          addCell(tr, b.id);
          addCell(tr, b.kind, "info");
          addCell(tr, active + " / " + b.max_concurrency);
          addCell(tr, cText, cls);
          addCell(tr, String(b.consecutive_failures));
          addCell(tr, ok + " ok / " + err + " err");
          bBody.appendChild(tr);
        }

        const rBody = document.getElementById("requests-body");
        rBody.replaceChildren();
        for (const row of m.reqs) {
          const tr = document.createElement("tr");
          const cls = row.status.startsWith("2") ? "ok" : (row.status.startsWith("4") ? "warn" : "err");
          addCell(tr, row.protocol);
          addCell(tr, row.endpoint);
          addCell(tr, row.status, cls);
          addCell(tr, String(row.count));
          rBody.appendChild(tr);
        }
      } catch (err) {
        document.getElementById("meta").textContent = "poll error: " + String(err);
      }
    }

    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
