[package]
name = "vouch"
version = "2.0.0"
edition = "2024"
description = "Local authentication multiplexer and process-supervised gateway for AI orchestrators"
license = "GPL-3.0-or-later"
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
arc-swap = "1.9.5"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
bytes = "1.12.2"
clap = { version = "4.6.10", features = ["derive"] }
crossterm = "0.29.0"
dashmap = "6.2.1"
futures = "0.3.34"
getrandom = "0.3.4"
globset = "0.4.22"
hex = "0.4.3"
hyper = { version = "1.13.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
notify = "9.0.0"
parking_lot = "0.13.0"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
subtle = "2.6.1"
thiserror = "2.0.21"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.20"
toml = "1.2.3"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.29.3"
vte = "0.15.0"

[target."cfg(unix)".dependencies]
nix = { version = "0.32.0", features = ["process", "signal"] }

[dev-dependencies]
tempfile = "3.27.0"
